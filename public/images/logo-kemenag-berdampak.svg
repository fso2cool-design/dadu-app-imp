<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" fill="none">
  <!-- Left Emblem Mark -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Blue Strokes (#1B75BC) -->
    <!-- Top-Left Outer Frame -->
    <path d="M 22 170 L 22 28 C 22 24 24 22 28 22 L 105 22" stroke="#1B75BC" stroke-width="12" />
    
    <!-- Outer concentric arch -->
    <path d="M 22 96 C 45 52 82 35 125 35" stroke="#1B75BC" stroke-width="12" />
    
    <!-- Middle concentric arch -->
    <path d="M 22 135 C 55 88 95 72 132 72" stroke="#1B75BC" stroke-width="11" />
    
    <!-- Stylized Chevron / Open Book Leaf in center -->
    <path d="M 46 128 C 65 142 80 156 86 168 C 92 156 107 142 126 128" stroke="#1B75BC" stroke-width="11" />
    <path d="M 86 168 L 86 122" stroke="#1B75BC" stroke-width="10" />

    <!-- Lower left concentric sweep -->
    <path d="M 22 170 C 42 165 60 172 70 178" stroke="#1B75BC" stroke-width="11" />
    <path d="M 22 152 C 38 145 54 148 64 156" stroke="#1B75BC" stroke-width="10" />

    <!-- Vertical Data Bars on Top Right -->
    <line x1="126" y1="122" x2="126" y2="85" stroke="#1B75BC" stroke-width="11" />
    <line x1="148" y1="122" x2="148" y2="52" stroke="#1B75BC" stroke-width="11" />
    <line x1="170" y1="122" x2="170" y2="24" stroke="#1B75BC" stroke-width="11" />
    <!-- Horizontal connector under bars -->
    <path d="M 115 122 L 175 122" stroke="#1B75BC" stroke-width="10" />

    <!-- Gold / Ochre Strokes (#D58F22) -->
    <!-- Bottom Right Frame and Arches -->
    <path d="M 98 172 C 108 152 128 135 158 135 L 174 135 C 176 135 178 137 178 140 L 178 172" stroke="#D58F22" stroke-width="12" />
    <path d="M 124 172 C 132 160 144 154 162 154" stroke="#D58F22" stroke-width="11" />
    <path d="M 86 172 L 178 172" stroke="#D58F22" stroke-width="11" />
  </g>

  <!-- Typography Right Side -->
  <!-- Kemenag -->
  <text 
    x="210" 
    y="86" 
    fill="#1B75BC" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="74" 
    font-weight="800" 
    letter-spacing="-1.5px"
  >Kemenag</text>

  <!-- Berdampak -->
  <text 
    x="210" 
    y="156" 
    fill="#D58F22" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-size="64" 
    font-weight="500" 
    letter-spacing="-0.5px"
  >Berdampak</text>
</svg>
