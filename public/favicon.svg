<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" width="100%" height="100%">
  <defs>
    <!-- Favicon Container Background Gradient (Dark Slate Glass for crisp contrast) -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D2A" />
      <stop offset="100%" stop-color="#0C0E15" />
    </linearGradient>

    <!-- Hexagonal Teal Crystal Facets -->
    <linearGradient id="favTealTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="favTealLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="favTealRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Gold Frame and Power Core -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <radialGradient id="favAmberSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>

    <radialGradient id="favTealSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#5EEAD4" />
      <stop offset="70%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#042F2E" />
    </radialGradient>

    <radialGradient id="favCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Clean squircle badge with subtle border -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" />
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="#2DD4BF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Hexagonal Crystal Body -->
  <!-- Center at (64, 64), R=40 -->
  <!-- Vertices: Top (64,24), TR (98.6,44), BR (98.6,84), Bot (64,104), BL (29.4,84), TL (29.4,44) -->
  <polygon points="64,24 99,44 64,64 29,44" fill="url(#favTealTop)" />
  <polygon points="29,44 64,64 64,104 29,84" fill="url(#favTealLeft)" />
  <polygon points="64,64 99,44 99,84 64,104" fill="url(#favTealRight)" />

  <!-- Data Traces -->
  <g stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <line x1="64" y1="36" x2="48" y2="44" />
    <line x1="48" y1="44" x2="38" y2="44" />
    <line x1="64" y1="36" x2="80" y2="44" />
    <line x1="80" y1="44" x2="90" y2="44" />
    <line x1="40" y1="60" x2="52" y2="67" />
    <line x1="52" y1="67" x2="52" y2="80" />
    <line x1="88" y1="60" x2="76" y2="67" />
    <line x1="76" y1="67" x2="76" y2="80" />
  </g>

  <!-- Glass Struts -->
  <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round">
    <line x1="64" y1="24" x2="99" y2="44" />
    <line x1="99" y1="44" x2="99" y2="84" />
    <line x1="99" y1="84" x2="64" y2="104" />
    <line x1="64" y1="104" x2="29" y2="84" />
    <line x1="29" y1="84" x2="29" y2="44" />
    <line x1="29" y1="44" x2="64" y2="24" />
  </g>

  <!-- Central Glowing Amber Power Cube -->
  <circle cx="64" cy="64" r="20" fill="url(#favCoreGlow)" />
  <!-- Wireframe cube -->
  <polygon points="64,50 78,58 64,66 50,58" fill="none" stroke="url(#favGold)" stroke-width="2.4" stroke-linejoin="round" />
  <line x1="50" y1="58" x2="50" y2="74" stroke="url(#favGold)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="78" y1="58" x2="78" y2="74" stroke="url(#favGold)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="64" y1="66" x2="64" y2="82" stroke="url(#favGold)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="50" y1="74" x2="64" y2="82" stroke="url(#favGold)" stroke-width="2.4" stroke-linecap="round" />
  <line x1="78" y1="74" x2="64" y2="82" stroke="url(#favGold)" stroke-width="2.4" stroke-linecap="round" />

  <!-- Inner hot core -->
  <polygon points="64,56 72,61 64,66 56,61" fill="#FEF08A" />
  <polygon points="56,61 64,66 64,74 56,69" fill="#F59E0B" />
  <polygon points="64,66 72,61 72,69 64,74" fill="#D97706" />

  <!-- Apex Nodes -->
  <!-- Top (Amber) -->
  <circle cx="64" cy="24" r="6.5" fill="url(#favAmberSphere)" stroke="#FFFFFF" stroke-width="0.8" />
  <!-- Bottom (Amber) -->
  <circle cx="64" cy="104" r="6.5" fill="url(#favAmberSphere)" stroke="#FFFFFF" stroke-width="0.8" />
  <!-- TL & TR (Gold) -->
  <circle cx="29" cy="44" r="5.5" fill="url(#favAmberSphere)" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="99" cy="44" r="5.5" fill="url(#favAmberSphere)" stroke="#FFFFFF" stroke-width="0.8" />
  <!-- BL & BR (Teal) -->
  <circle cx="29" cy="84" r="5.5" fill="url(#favTealSphere)" stroke="#FFFFFF" stroke-width="0.8" />
  <circle cx="99" cy="84" r="5.5" fill="url(#favTealSphere)" stroke="#FFFFFF" stroke-width="0.8" />
</svg>
