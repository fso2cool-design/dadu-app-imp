<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 105" fill="none">
  <defs>
    <!-- Top Red Cap Gradient -->
    <linearGradient id="topRedCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4A5A" />
      <stop offset="100%" stop-color="#E22436" />
    </linearGradient>

    <!-- Left Red Block Gradient -->
    <linearGradient id="leftRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB3949" />
      <stop offset="100%" stop-color="#C91B2D" />
    </linearGradient>

    <!-- Right Sky Blue Block Gradient -->
    <linearGradient id="rightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CC1FF" />
      <stop offset="100%" stop-color="#008FE0" />
    </linearGradient>

    <!-- Center Cube: Top Orange Diamond -->
    <linearGradient id="centerOrangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E67D15" />
      <stop offset="60%" stop-color="#F59325" />
      <stop offset="100%" stop-color="#FFA642" />
    </linearGradient>

    <!-- Center Cube: Right Yellow Face -->
    <linearGradient id="centerYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD338" />
      <stop offset="100%" stop-color="#F5AC08" />
    </linearGradient>

    <!-- Bottom Green Block Gradient -->
    <linearGradient id="bottomGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53D263" />
      <stop offset="100%" stop-color="#35A344" />
    </linearGradient>

    <!-- Floating Lower Left Green Tab -->
    <linearGradient id="tabGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43C754" />
      <stop offset="100%" stop-color="#2E993D" />
    </linearGradient>

    <!-- Floating Lower Right Blue Tab -->
    <linearGradient id="tabBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14BAFC" />
      <stop offset="100%" stop-color="#007ECC" />
    </linearGradient>
  </defs>

  <!-- Ground contact shadow -->
  <ellipse cx="50" cy="98" rx="26" ry="4.5" fill="#000000" opacity="0.35" />

  <!-- 1. TOP RED CAP -->
  <path d="M 50 11.5 Q 59 14.5 60.5 21 L 50 26.5 L 39.5 21 Q 41 14.5 50 11.5 Z" fill="url(#topRedCapGrad)"/>

  <!-- 2. TOP-LEFT RED BLOCK -->
  <path d="M 37.5 22.5 L 48 28 L 31 38 L 31 60 L 14 50.5 L 14 34 Q 14 26 22 21.5 L 34 14.5 L 37.5 22.5 Z" fill="url(#leftRedGrad)"/>

  <!-- 3. TOP-RIGHT SKY BLUE BLOCK -->
  <path d="M 62.5 22.5 L 52 28 L 69 38 L 69 60 L 86 50.5 L 86 34 Q 86 26 78 21.5 L 66 14.5 L 62.5 22.5 Z" fill="url(#rightBlueGrad)"/>

  <!-- 4. CENTER CUBE - TOP DIAMOND FACE -->
  <path d="M 50 29 L 68 39.5 L 50 50 L 32 39.5 Z" fill="url(#centerOrangeGrad)"/>

  <!-- 5. CENTER CUBE - RIGHT FACE -->
  <path d="M 50 50 L 68 39.5 L 68 61 L 50 71.5 Z" fill="url(#centerYellowGrad)"/>

  <!-- 6. BOTTOM GREEN BLOCK -->
  <path d="M 32 61 L 50 50 L 50 71.5 L 68 61 L 68 77 L 54 85 Q 50 87.5 46 85 L 32 77 Z" fill="url(#bottomGreenGrad)"/>

  <!-- 7. FLOATING LOWER-LEFT GREEN TAB -->
  <path d="M 14 59 L 24 59 L 24 71 L 23 72.5 Q 14 74 14 65.5 Z" fill="url(#tabGreenGrad)"/>

  <!-- 8. FLOATING LOWER-RIGHT SKY BLUE TAB -->
  <path d="M 86 59 L 76 59 L 76 71 L 77 72.5 Q 86 74 86 65.5 Z" fill="url(#tabBlueGrad)"/>
</svg>
