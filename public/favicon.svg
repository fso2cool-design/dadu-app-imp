<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Ambient Base Glow -->
    <filter id="daduAmbientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Top Face: Lime Green to Leaf Green -->
    <linearGradient id="topOuterGrad" x1="256" y1="38" x2="256" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CD63F" />
      <stop offset="100%" stop-color="#62BD2E" />
    </linearGradient>
    <linearGradient id="topInnerGrad" x1="256" y1="76" x2="256" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3FA64A" />
      <stop offset="100%" stop-color="#2D8538" />
    </linearGradient>

    <!-- Left Face: Bright Coral Red to Deep Scarlet -->
    <linearGradient id="leftOuterGrad" x1="50" y1="172" x2="242" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FA394E" />
      <stop offset="100%" stop-color="#E22336" />
    </linearGradient>
    <linearGradient id="leftInnerGrad" x1="86" y1="198" x2="226" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C72B3E" />
      <stop offset="100%" stop-color="#A81D2E" />
    </linearGradient>

    <!-- Right Face: Amber-Orange transitioning to Radiant Yellow at bottom -->
    <linearGradient id="rightOuterGrad" x1="366" y1="172" x2="366" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F89D1E" />
      <stop offset="65%" stop-color="#FBB220" />
      <stop offset="100%" stop-color="#FFCE2B" />
    </linearGradient>
    <linearGradient id="rightInnerGrad" x1="356" y1="198" x2="356" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F58518" />
      <stop offset="100%" stop-color="#EB7011" />
    </linearGradient>

    <!-- Shimmer Specular Beam Clip Path of the entire Cube -->
    <clipPath id="cubeFullClip">
      <path d="M 240.3 46.8 A 32.0 32.0 0 0 0 271.7 46.8 L 393.5 115.2 A 32.0 32.0 0 0 0 389.7 172.8 L 264.1 222.8 A 22.0 22.0 0 0 0 247.9 222.8 L 122.3 172.8 A 32.0 32.0 0 0 0 118.5 115.2 Z" />
      <path d="M 230.3 239.6 A 18.0 18.0 0 0 0 242.0 256.5 L 242.0 407.6 A 28.0 28.0 0 0 0 204.2 433.8 L 70.8 383.8 A 32.0 32.0 0 0 0 50.0 353.8 L 50.0 209.5 A 26.0 26.0 0 0 0 85.1 185.2 Z" />
      <path d="M 270.0 256.5 A 18.0 18.0 0 0 0 281.7 239.6 L 426.9 185.2 A 26.0 26.0 0 0 0 462.0 209.5 L 462.0 353.8 A 32.0 32.0 0 0 0 441.2 383.8 L 307.8 433.8 A 28.0 28.0 0 0 0 270.0 407.6 Z" />
    </clipPath>

    <!-- Sweeping Shine Gradient -->
    <linearGradient id="shineBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes daduShine {
      0% {
        transform: translate(-450px, -450px) rotate(25deg);
      }
      25% {
        transform: translate(450px, 450px) rotate(25deg);
      }
      100% {
        transform: translate(450px, 450px) rotate(25deg);
      }
    }
    @keyframes daduBreathing {
      0%, 100% {
        filter: drop-shadow(0 4px 16px rgba(109, 194, 59, 0.22)) drop-shadow(0 6px 24px rgba(235, 42, 62, 0.16));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 8px 26px rgba(124, 214, 63, 0.36)) drop-shadow(0 10px 30px rgba(251, 178, 32, 0.28));
        transform: scale(1.012);
      }
    }
    .dadu-cube-group {
      transform-origin: 256px 256px;
      animation: daduBreathing 4s ease-in-out infinite;
    }
    .dadu-shine-rect {
      animation: daduShine 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 256px 256px;
    }
  </style>

  <g class="dadu-cube-group">
    <!-- 1. TOP FACE (Green) -->
    <path d="M 240.3 46.8 A 32.0 32.0 0 0 0 271.7 46.8 L 393.5 115.2 A 32.0 32.0 0 0 0 389.7 172.8 L 264.1 222.8 A 22.0 22.0 0 0 0 247.9 222.8 L 122.3 172.8 A 32.0 32.0 0 0 0 118.5 115.2 Z" fill="url(#topOuterGrad)" />
    <path d="M 246.8 80.8 A 20.0 20.0 0 0 0 265.2 80.8 L 373.1 136.8 A 20.0 20.0 0 0 0 370.6 173.4 L 260.7 212.3 A 14.0 14.0 0 0 0 251.3 212.3 L 141.4 173.4 A 20.0 20.0 0 0 0 138.9 136.8 Z" fill="url(#topInnerGrad)" />

    <!-- 2. LEFT FACE (Red) -->
    <path d="M 230.3 239.6 A 18.0 18.0 0 0 0 242.0 256.5 L 242.0 407.6 A 28.0 28.0 0 0 0 204.2 433.8 L 70.8 383.8 A 32.0 32.0 0 0 0 50.0 353.8 L 50.0 209.5 A 26.0 26.0 0 0 0 85.1 185.2 Z" fill="url(#leftOuterGrad)" />
    <path d="M 217.8 258.3 A 14.0 14.0 0 0 0 226.0 271.0 L 226.0 388.9 A 20.0 20.0 0 0 0 197.7 407.1 L 98.9 361.9 A 22.0 22.0 0 0 0 86.0 341.9 L 86.0 226.0 A 18.0 18.0 0 0 0 111.5 209.6 Z" fill="url(#leftInnerGrad)" />

    <!-- 3. RIGHT FACE (Orange-Yellow) -->
    <path d="M 270.0 256.5 A 18.0 18.0 0 0 0 281.7 239.6 L 426.9 185.2 A 26.0 26.0 0 0 0 462.0 209.5 L 462.0 353.8 A 32.0 32.0 0 0 0 441.2 383.8 L 307.8 433.8 A 28.0 28.0 0 0 0 270.0 407.6 Z" fill="url(#rightOuterGrad)" />
    <path d="M 286.0 271.0 A 14.0 14.0 0 0 0 294.2 258.3 L 400.5 209.6 A 18.0 18.0 0 0 0 426.0 226.0 L 426.0 341.9 A 22.0 22.0 0 0 0 413.1 361.9 L 314.3 407.1 A 20.0 20.0 0 0 0 286.0 388.9 Z" fill="url(#rightInnerGrad)" />

    <!-- 4. ANIMATED SHINE BEAM (Sweeps across all 3 faces through clip-path) -->
    <g clip-path="url(#cubeFullClip)">
      <rect 
        class="dadu-shine-rect" 
        x="-200" 
        y="-200" 
        width="900" 
        height="900" 
        fill="url(#shineBeam)" 
        pointer-events="none" 
      />
    </g>
  </g>
</svg>