<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%" shape-rendering="geometricPrecision">
  <g id="dadu-floating-cube" transform="translate(256, 252) scale(1.16) translate(-315.5, -271.5)">
    <!-- 1. Left top outer facet (Purple) -->
    <polygon points="140,157 271,81 271,235 140,310" fill="#5048a4" />

    <!-- 2. Right top outer facet (Yellow) -->
    <polygon points="359,81 491,157 491,310 359,235" fill="#ffe000" />

    <!-- 3. Bottom front facet (Peach) -->
    <polygon points="185,386 315,310 446,386 315,462" fill="#f49a5c" />

    <!-- 4. Top inner facet / cap (Cyan) -->
    <polygon points="184,181 315,106 446,181 315,258" fill="#8bd1dc" opacity="0.94" />

    <!-- 5. Left lower face (Amethyst) -->
    <polygon points="162,196 294,272 294,423 162,347" fill="#784d92" />

    <!-- 6. Right lower face (Ruby) -->
    <polygon points="337,272 469,196 469,347 337,423" fill="#d33248" />

    <!-- 7. Left shading overlay (Semi-transparent Purple) -->
    <polygon points="162,196 294,272 294,423 162,347" fill="#5e2180" opacity="0.3" />

    <!-- 8. Right shading overlay (Semi-transparent Ruby) -->
    <polygon points="337,272 469,196 469,347 337,423" fill="#bf1f32" opacity="0.26" />
  </g>
</svg>