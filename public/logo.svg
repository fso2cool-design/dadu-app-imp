<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Soft Floor Ambient Shadows -->
    <radialGradient id="daduGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#B45309" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Core Volumetric Glow Filter -->
    <filter id="coreGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Specular Filter -->
    <filter id="specularGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hexagonal Teal Crystal Facets -->
    <linearGradient id="tealFacetTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="tealFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#064E3B" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="tealFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.92" />
      <stop offset="50%" stop-color="#0F766E" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0.98" />
    </linearGradient>

    <!-- Glass Strut Gradient -->
    <linearGradient id="glassStrut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#CCFBF1" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#99F6E4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65" />
    </linearGradient>

    <!-- Metallic Gold Wireframe Beams -->
    <linearGradient id="goldBeamTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="goldBeamLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="goldBeamRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Inner Luminous Power Cube -->
    <radialGradient id="coreRadiance" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF9C3" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <linearGradient id="luminousCubeTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="luminousCubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="luminousCubeRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 3D Glass Amber Spheres (Top & Bottom Nodes) -->
    <radialGradient id="sphereAmberTop" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <radialGradient id="sphereAmberBottom" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>

    <!-- 3D Metallic Gold Spheres (Upper Side Nodes) -->
    <radialGradient id="sphereGold" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- 3D Teal Crystal Glass Spheres (Lower Side Nodes) -->
    <radialGradient id="sphereTeal" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="22%" stop-color="#5EEAD4" />
      <stop offset="55%" stop-color="#14B8A6" />
      <stop offset="85%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </radialGradient>

    <!-- Circuit Trace Glow Filter -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Ambient Floor Drop Shadow -->
  <ellipse cx="256" cy="460" rx="130" ry="24" fill="url(#daduGroundShadow)" />
  <ellipse cx="256" cy="454" rx="70" ry="12" fill="#D97706" opacity="0.18" />

  <!-- 2. Hexagonal Translucent Teal Crystal Prism Body -->
  <g id="crystal-facets" opacity="0.94">
    <!-- Top Isometric Facet (256,76) -> (412,166) -> (256,256) -> (100,166) -->
    <polygon points="256,76 412,166 256,256 100,166" fill="url(#tealFacetTop)" />

    <!-- Left Isometric Facet (100,166) -> (256,256) -> (256,436) -> (100,346) -->
    <polygon points="100,166 256,256 256,436 100,346" fill="url(#tealFacetLeft)" />

    <!-- Right Isometric Facet (256,256) -> (412,166) -> (412,346) -> (256,436) -->
    <polygon points="256,256 412,166 412,346 256,436" fill="url(#tealFacetRight)" />

    <!-- Facet Inner Bevel Seams -->
    <line x1="256" y1="76" x2="256" y2="256" stroke="#5EEAD4" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="256" y1="256" x2="100" y2="346" stroke="#042F2E" stroke-width="2" stroke-opacity="0.6" />
    <line x1="256" y1="256" x2="412" y2="346" stroke="#042F2E" stroke-width="2" stroke-opacity="0.6" />
  </g>

  <!-- 3. Printed Circuit Board (PCB) Electronic Traces (Etched in Crystal) -->
  <g id="circuit-traces" stroke="#FFFFFF" stroke-opacity="0.75" stroke-linecap="round" stroke-linejoin="round" filter="url(#circuitGlow)">
    <!-- Top Facet Circuit Traces -->
    <path d="M 256,120 L 220,140 L 160,140" stroke-width="1.8" />
    <circle cx="160" cy="140" r="3" fill="#FFFFFF" />
    <circle cx="256" cy="120" r="2.5" fill="#FEF08A" />

    <path d="M 256,120 L 290,140 L 350,140" stroke-width="1.8" />
    <circle cx="350" cy="140" r="3" fill="#FFFFFF" />

    <path d="M 210,165 L 256,192 L 302,165" stroke-width="1.5" stroke-opacity="0.65" />
    <circle cx="210" cy="165" r="2" fill="#FFFFFF" />
    <circle cx="302" cy="165" r="2" fill="#FFFFFF" />

    <path d="M 180,180 L 140,157 L 120,157" stroke-width="1.4" stroke-opacity="0.5" />
    <circle cx="120" cy="157" r="2" fill="#FFFFFF" />

    <path d="M 332,180 L 372,157 L 392,157" stroke-width="1.4" stroke-opacity="0.5" />
    <circle cx="392" cy="157" r="2" fill="#FFFFFF" />

    <!-- Left Facet Circuit Traces -->
    <path d="M 140,220 L 180,243 L 180,310 L 210,327" stroke-width="1.8" />
    <circle cx="140" cy="220" r="2.5" fill="#FFFFFF" />
    <circle cx="210" cy="327" r="3" fill="#5EEAD4" />

    <path d="M 120,270 L 150,287 L 150,350 L 190,373" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="120" cy="270" r="2" fill="#FFFFFF" />
    <circle cx="190" cy="373" r="2.5" fill="#FFFFFF" />

    <path d="M 160,375 L 220,410" stroke-width="1.4" stroke-opacity="0.5" />
    <circle cx="160" cy="375" r="2" fill="#FFFFFF" />

    <!-- Right Facet Circuit Traces -->
    <path d="M 372,220 L 332,243 L 332,310 L 302,327" stroke-width="1.8" />
    <circle cx="372" cy="220" r="2.5" fill="#FFFFFF" />
    <circle cx="302" cy="327" r="3" fill="#5EEAD4" />

    <path d="M 392,270 L 362,287 L 362,350 L 322,373" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="392" cy="270" r="2" fill="#FFFFFF" />
    <circle cx="322" cy="373" r="2.5" fill="#FFFFFF" />

    <path d="M 352,375 L 292,410" stroke-width="1.4" stroke-opacity="0.5" />
    <circle cx="352" cy="375" r="2" fill="#FFFFFF" />
  </g>

  <!-- 4. Cylindrical Glass Struts (Lattice Frame) -->
  <g id="glass-struts" stroke="url(#glassStrut)" stroke-linecap="round">
    <!-- Outer Hexagon Outline Struts -->
    <line x1="256" y1="76" x2="412" y2="166" stroke-width="7" stroke-opacity="0.8" />
    <line x1="412" y1="166" x2="412" y2="346" stroke-width="7" stroke-opacity="0.7" />
    <line x1="412" y1="346" x2="256" y2="436" stroke-width="7" stroke-opacity="0.75" />
    <line x1="256" y1="436" x2="100" y2="346" stroke-width="7" stroke-opacity="0.75" />
    <line x1="100" y1="346" x2="100" y2="166" stroke-width="7" stroke-opacity="0.7" />
    <line x1="100" y1="166" x2="256" y2="76" stroke-width="7" stroke-opacity="0.8" />

    <!-- Glass Highlights along Struts -->
    <line x1="256" y1="76" x2="412" y2="166" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9" />
    <line x1="100" y1="166" x2="256" y2="76" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9" />
    <line x1="412" y1="166" x2="412" y2="346" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.6" />
    <line x1="100" y1="166" x2="100" y2="346" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.6" />

    <!-- Center Struts to Hub -->
    <line x1="256" y1="76" x2="256" y2="196" stroke-width="5.5" stroke-opacity="0.6" />
    <line x1="100" y1="346" x2="194" y2="304" stroke-width="5.5" stroke-opacity="0.6" />
    <line x1="412" y1="346" x2="318" y2="304" stroke-width="5.5" stroke-opacity="0.6" />
    <line x1="256" y1="436" x2="256" y2="340" stroke-width="5.5" stroke-opacity="0.6" />
  </g>

  <!-- 5. Volumetric Glow Radiating from Inner Power Cube -->
  <circle cx="256" cy="268" r="88" fill="url(#coreRadiance)" opacity="0.45" filter="url(#coreGlow)" />
  <circle cx="256" cy="268" r="52" fill="#FDE047" opacity="0.65" filter="url(#coreGlow)" />

  <!-- 6. Central Brass / Gold Wireframe Cube Frame -->
  <g id="gold-cube-frame">
    <!-- Back / Hidden Wireframe Lines (subtle depth) -->
    <line x1="256" y1="196" x2="256" y2="236" stroke="#B45309" stroke-width="3.5" stroke-opacity="0.4" />
    <line x1="194" y1="232" x2="230" y2="253" stroke="#B45309" stroke-width="3.5" stroke-opacity="0.4" />
    <line x1="318" y1="232" x2="282" y2="253" stroke="#B45309" stroke-width="3.5" stroke-opacity="0.4" />

    <!-- Front Beams: Top Face of Cube -->
    <!-- (256,196) -> (318,232) -> (256,268) -> (194,232) -->
    <polygon points="256,196 318,232 256,268 194,232" fill="none" stroke="url(#goldBeamTop)" stroke-width="8" stroke-linejoin="round" />
    <polygon points="256,196 318,232 256,268 194,232" fill="none" stroke="#FEF9C3" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.8" />

    <!-- Vertical Front Edges -->
    <line x1="194" y1="232" x2="194" y2="304" stroke="url(#goldBeamLeft)" stroke-width="8" stroke-linecap="round" />
    <line x1="318" y1="232" x2="318" y2="304" stroke="url(#goldBeamRight)" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="268" x2="256" y2="340" stroke="url(#goldBeamTop)" stroke-width="8" stroke-linecap="round" />

    <!-- Bottom Front Beams -->
    <line x1="194" y1="304" x2="256" y2="340" stroke="url(#goldBeamLeft)" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="340" x2="318" y2="304" stroke="url(#goldBeamRight)" stroke-width="8" stroke-linecap="round" />

    <!-- Specular Highlight Lines on Gold Frame -->
    <line x1="196" y1="233" x2="256" y2="267" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.75" />
    <line x1="256" y1="268" x2="256" y2="338" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" />
  </g>

  <!-- 7. Central Floating Luminous Power Cube (Solid Radiant Crystal Inside Frame) -->
  <g id="luminous-core" filter="url(#coreGlow)">
    <!-- Top Face of Inner Core -->
    <polygon points="256,224 294,246 256,268 218,246" fill="url(#luminousCubeTop)" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Left Face of Inner Core -->
    <polygon points="218,246 256,268 256,312 218,290" fill="url(#luminousCubeLeft)" stroke="#FDE047" stroke-width="1" />
    <!-- Right Face of Inner Core -->
    <polygon points="256,268 294,246 294,290 256,312" fill="url(#luminousCubeRight)" stroke="#FEF08A" stroke-width="1" />

    <!-- Bright White Hot Center Burst -->
    <circle cx="256" cy="268" r="14" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- 8. Spherical 3D Nodes at Lattice Vertices -->
  <g id="nodes" filter="url(#specularGlow)">
    <!-- Bottom Apex Sphere (Amber with Caustic Base) at (256, 436) -->
    <circle cx="256" cy="436" r="28" fill="url(#sphereAmberBottom)" />
    <!-- Specular rim highlight on bottom sphere -->
    <ellipse cx="248" cy="426" rx="9" ry="5" fill="#FFFFFF" opacity="0.85" transform="rotate(-15 248 426)" />
    <circle cx="266" cy="444" r="4" fill="#FEF08A" opacity="0.6" />

    <!-- Lower-Left Sphere (Teal Glass) at (100, 346) -->
    <circle cx="100" cy="346" r="25" fill="url(#sphereTeal)" />
    <ellipse cx="92" cy="338" rx="8" ry="4.5" fill="#FFFFFF" opacity="0.9" transform="rotate(-20 92 338)" />
    <circle cx="108" cy="354" r="3.5" fill="#5EEAD4" opacity="0.75" />

    <!-- Lower-Right Sphere (Teal Glass) at (412, 346) -->
    <circle cx="412" cy="346" r="25" fill="url(#sphereTeal)" />
    <ellipse cx="404" cy="338" rx="8" ry="4.5" fill="#FFFFFF" opacity="0.9" transform="rotate(-20 404 338)" />
    <circle cx="420" cy="354" r="3.5" fill="#5EEAD4" opacity="0.75" />

    <!-- Upper-Left Sphere (Metallic Gold) at (100, 166) -->
    <circle cx="100" cy="166" r="23" fill="url(#sphereGold)" />
    <ellipse cx="93" cy="158" rx="7.5" ry="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-25 93 158)" />

    <!-- Upper-Right Sphere (Metallic Gold) at (412, 166) -->
    <circle cx="412" cy="166" r="23" fill="url(#sphereGold)" />
    <ellipse cx="405" cy="158" rx="7.5" ry="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-25 405 158)" />

    <!-- Top Apex Sphere (Honey Amber Glass) at (256, 76) -->
    <circle cx="256" cy="76" r="26" fill="url(#sphereAmberTop)" />
    <!-- Main crescent specular highlight -->
    <ellipse cx="248" cy="67" rx="9" ry="5" fill="#FFFFFF" opacity="0.95" transform="rotate(-20 248 67)" />
    <circle cx="266" cy="85" r="4.5" fill="#FEF9C3" opacity="0.7" />

    <!-- Center Junction Accent Nodes -->
    <circle cx="194" cy="232" r="7" fill="#FDE047" stroke="#B45309" stroke-width="1.5" />
    <circle cx="194" cy="232" r="2.5" fill="#FFFFFF" />

    <circle cx="318" cy="232" r="7" fill="#FDE047" stroke="#B45309" stroke-width="1.5" />
    <circle cx="318" cy="232" r="2.5" fill="#FFFFFF" />

    <circle cx="194" cy="304" r="7" fill="#2DD4BF" stroke="#064E3B" stroke-width="1.5" />
    <circle cx="194" cy="304" r="2.5" fill="#FFFFFF" />

    <circle cx="318" cy="304" r="7" fill="#2DD4BF" stroke="#064E3B" stroke-width="1.5" />
    <circle cx="318" cy="304" r="2.5" fill="#FFFFFF" />

    <circle cx="256" cy="340" r="8" fill="#FBBF24" stroke="#78350F" stroke-width="1.5" />
    <circle cx="256" cy="340" r="3" fill="#FFFFFF" />
  </g>
</svg>
